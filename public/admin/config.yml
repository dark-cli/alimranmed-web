# Sveltia CMS configuration
# Mirrors the Zod schema in src/content.config.ts.
#
# Content is bilingual with structure `<collection>/<slug>/en.md` and
# `<collection>/<slug>/ar.md`. Sveltia's built-in i18n structures don't match
# this exactly, so we define two separate entry collections per content type
# (mirroring the earlier tina/config.ts approach) using `path: "{{slug}}/<locale>"`.

# Placeholder GitHub backend for production. Sveltia CMS uses the browser's
# File System Access API for local editing (via "Work with Local Repository"),
# so no decap-server proxy or local_backend flag is needed. The user picks
# the repo folder once from the CMS login screen.
# NOTE: local editing requires a Chromium-based browser (Chrome, Edge, Brave).
backend:
  name: github
  repo: placeholder/alimranmed-web
  branch: main

media_folder: public/images
public_folder: /images

# CRITICAL: prevents empty optional fields from being written as `null`,
# which would fail Zod's `.optional()` for arrays (e.g. `titles: null`).
output:
  omit_empty_optional_fields: true

# ── Section block templates (variable-type list) ─────────────────────────
# Referenced by *sections_field below. YAML anchors DO work for whole node
# reuse (objects), so we can alias the entire sections field definition —
# but they can't splice into sequences, so per-collection field lists are
# written out explicitly.

# Unified sections field — used by ALL collections (treatments, services,
# blog, doctors). Mirrors the section discriminated union in content.config.ts.
_sections_field: &sections_field
  label: Sections
  name: sections
  widget: list
  required: false
  typeKey: type
  types:
    - name: prose
      label: Prose
      fields:
        - { label: Heading (appears in TOC), name: heading, widget: string, required: false }
        - { label: Body (markdown — inline links supported), name: body, widget: text }
    - name: highlights
      label: Highlights (At a glance)
      fields:
        - { label: Heading, name: heading, widget: string, required: false, hint: "Defaults to 'At a glance' / 'لمحة سريعة'." }
        - label: Items
          name: items
          widget: list
          min: 2
          max: 4
          fields:
            - { label: Label, name: label, widget: string }
            - { label: Value, name: value, widget: text }
    - name: stats
      label: Stats
      fields:
        - { label: Heading, name: heading, widget: string, required: false }
        - { label: Intro, name: intro, widget: text, required: false }
        - label: Items
          name: items
          widget: list
          min: 2
          max: 6
          fields:
            - { label: Value (big number / metric), name: value, widget: string }
            - { label: Label (short description), name: label, widget: string }
    - name: facts
      label: Facts (numbered list)
      fields:
        - { label: Heading, name: heading, widget: string, required: false, hint: "Defaults to 'Key facts' / 'حقائق أساسية'." }
        - label: Items
          name: items
          widget: list
          field: { label: Fact, name: fact, widget: text }
    - name: list
      label: List
      fields:
        - label: Layout
          name: variant
          widget: select
          default: rows
          hint: "Rows: single-column stacked. Wrap: auto-fit responsive columns (good for memberships/tags). Columns: fixed 2-column grid."
          options:
            - { label: "Rows — single column, stacked", value: rows }
            - { label: "Wrap — responsive (as many cols as fit)", value: wrap }
            - { label: "Columns — fixed 2 columns", value: columns }
        - { label: Heading, name: heading, widget: string }
        - label: Items
          name: items
          widget: list
          min: 1
          fields:
            - { label: Label, name: label, widget: string, hint: "Short mono tag — date, year, code." }
            - { label: Body, name: body, widget: text }
            - { label: Subtitle, name: subtitle, widget: text, required: false, hint: "Optional secondary line. Supported by Rows and Columns; Wrap ignores it." }
    - name: quote
      label: Pull Quote
      fields:
        - { label: Quote text, name: text, widget: text }
        - { label: Attribution, name: attribution, widget: string, required: false }
    - name: panels
      label: Panels (comparison or options grid)
      fields:
        - { label: Heading, name: heading, widget: string, required: false }
        - { label: Intro, name: intro, widget: text, required: false }
        - { label: Note (footer line), name: note, widget: string, required: false }
        - label: Panels
          name: panels
          widget: list
          min: 2
          max: 4
          fields:
            - { label: Eyebrow, name: eyebrow, widget: string, required: false, hint: "Small label above title — e.g. 'Before' / 'After'." }
            - { label: Title, name: title, widget: string }
            - { label: Subtitle, name: subtitle, widget: string, required: false }
            - label: Items
              name: items
              widget: list
              field: { label: Item (markdown links ok), name: item, widget: string }
    - name: media
      label: Media (image / video / YouTube)
      fields:
        - label: Kind
          name: kind
          widget: select
          options: [image, video, youtube]
        - { label: "Source — image path, video path, or YouTube ID/URL", name: src, widget: string }
        - { label: Alt text, name: alt, widget: string, required: false }
        - { label: Caption, name: caption, widget: string, required: false }
        - label: Aspect ratio
          name: aspect
          widget: select
          required: false
          options: ["16/9", "4/3", "3/2", "1/1"]
        - { label: Upload date (YouTube JSON-LD), name: uploadDate, widget: string, required: false }
    - name: pathway
      label: Pathway (link chip groups)
      fields:
        - { label: Heading, name: heading, widget: string, required: false }
        - { label: Intro, name: intro, widget: text, required: false }
        - label: Groups
          name: groups
          widget: list
          fields:
            - { label: Eyebrow, name: eyebrow, widget: string, required: false }
            - { label: Title, name: title, widget: string }
            - label: Items
              name: items
              widget: list
              fields:
                - { label: Name, name: name, widget: string }
                - { label: Link (href), name: href, widget: string }
    - name: row
      label: Row (image row)
      fields:
        - { label: Heading, name: heading, widget: string, required: false }
        - label: Columns
          name: columns
          widget: select
          default: auto
          options:
            - { label: "Auto (responsive fit)", value: auto }
            - { label: "2 columns", value: "2" }
            - { label: "3 columns", value: "3" }
            - { label: "4 columns", value: "4" }
        - label: Items
          name: items
          widget: list
          fields:
            - { label: Image path, name: src, widget: string }
            - { label: Alt text, name: alt, widget: string, required: false }
            - { label: Caption, name: caption, widget: string, required: false }
            - { label: Link (href), name: href, widget: string, required: false }
            - label: Aspect ratio
              name: aspect
              widget: select
              required: false
              options: ["16/9", "4/3", "3/2", "1/1"]
    - name: cards
      label: Cards (related links)
      fields:
        - { label: Heading, name: heading, widget: string, required: false, hint: "Defaults to 'Related reading' / 'قراءات ذات صلة'." }
        - label: Slugs
          name: slugs
          widget: list
          min: 1
          field: { label: Treatment/article slug, name: slug, widget: string }

# ── Collections ──────────────────────────────────────────────────────────
# Base fields (from pageBase in src/content.config.ts) are inlined into each
# collection's field list; YAML doesn't support splicing arrays via anchors.

collections:
  # ── Doctors ────────────────────────────────────────────────────────────
  - name: doctors_en
    label: "Doctors — English"
    label_singular: Doctor
    folder: src/content/doctors
    path: "{{slug}}/en"
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    create: true
    fields:
      # ── Identity ─────────────────────────────────────────────────────
      - { label: Full name, name: fullName, widget: string, hint: "Displayed as the H1 fallback and on the listing card." }
      - { label: Page title, name: title, widget: string, hint: "Used in the browser tab and site search." }
      - { label: Description, name: description, widget: text, required: false, hint: "One-line summary — meta description tag + listing card blurb." }
      - { label: Specialty, name: specialty, widget: string, required: false, hint: "Small caps chip on the listing card." }
      - label: Credentials / titles
        name: titles
        widget: list
        required: false
        default: []
        hint: "Post-nominal letters. Renders as chips in the detail hero AND as the creds line on the listing card."
        field: { label: Credential, name: credential, widget: string }
      - label: Languages
        name: languages
        widget: list
        required: false
        default: []
        hint: "Only shown on the listing card."
        field: { label: Language, name: language, widget: string }

      # ── Portrait ─────────────────────────────────────────────────────
      - label: Photo
        name: photo
        widget: image
        required: false
        hint: "Shown on both listing card and detail hero."
        media_folder: "/public/images/doctors"
        public_folder: "/images/doctors"
      - { label: Photo alt text, name: photoAlt, widget: string, required: false, hint: "Screen-reader description. Defaults to Full name." }

      # ── Hero copy (always present — every doctor has one) ────────────
      - { label: Hero eyebrow, name: heroEyebrow, widget: string, hint: "Small caps label above the name (e.g. 'Lead consultant · Clinical profile')." }
      - { label: Hero headline, name: heroHeadline, widget: string, required: false, hint: "Defaults to Full name if left empty." }
      - { label: Hero lede, name: heroLede, widget: text, hint: "One-paragraph intro shown under the name." }

      # ── CV sections (page body blocks — including memberships) ───────
      - *sections_field

      # ── Metadata (bookkeeping — not shown on the detail page) ────────
      - { label: Listing order, name: order, widget: number, required: false, default: 999, value_type: int, hint: "Sort key for the /doctors/ listing." }
      - { label: Last updated, name: updated, widget: datetime, required: false, picker_utc: true, hint: "Not displayed — used by SEO schema." }
      - { label: Legacy URL, name: legacyUrl, widget: string, required: false, hint: "Original alimranmed.com URL — migration bookkeeping only." }
      - label: Source
        name: source
        widget: select
        default: legacy-wp
        hint: "Provenance tag — not displayed on the page."
        options:
          - { label: Legacy WordPress, value: legacy-wp }
          - { label: AI draft, value: ai-draft }
          - { label: Human reviewed, value: human-reviewed }
          - { label: Original, value: original }
          - { label: Translated by LLM, value: translated-by-llm }
      - { label: Reviewed by, name: reviewedBy, widget: string, required: false, hint: "Clinician name — SEO schema only." }
      - { label: Reviewed at, name: reviewedAt, widget: datetime, required: false, picker_utc: true }

